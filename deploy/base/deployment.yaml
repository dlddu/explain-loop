apiVersion: apps/v1
kind: Deployment
metadata:
  name: explain-loop
spec:
  replicas: 1
  # /data 의 파일 저장소(패턴 레지스트리·설명 기록·점수)는 쓰기 프로세스가 하나여야 한다.
  # RollingUpdate 면 교체 중 옛 파드와 새 파드가 같은 파일을 동시에 쓴다.
  strategy:
    type: Recreate
  selector:
    matchLabels: {}
  template:
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # 이미지가 비루트 사용자로 돌게 되면 켤 것(distroless:nonroot 등).
        # runAsNonRoot: true
      containers:
        - name: explain-loop
          # 태그의 단일 출처. main push 마다 CI 의 `pin` job 이 deploy 브랜치에서 이 자리를
          # 커밋 SHA 로 고친다 — main 에 남는 값(`bootstrap` 포함)은 운영과 무관하다.
          # 태그가 불변이므로 imagePullPolicy 는 기본값(IfNotPresent)이 옳다.
          image: ghcr.io/dlddu/explain-loop:bootstrap
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      # emptyDir 는 seam 이다: overlays/prod 가 PVC 로 바꾸고, e2e 는 그대로 둔다.
      # 인덱스 0 을 overlays/prod 의 patch 가 잡고 있으니 볼륨 순서를 바꾸면 함께 고칠 것.
      volumes:
        - name: data
          emptyDir: {}
