# pr.yml 에서만 호출된다(단독 트리거 없음). 트리거와 단일 필수 체크(`pr-gate`)는 pr.yml 에 있다.
#
# `sha` 는 PR head SHA 다. image.yml 이 이미 이 태그로 이미지를 발행했고, e2e 는 그것을
# pull 해 kind 에 올린다 — 여기서 다시 빌드하지 않는다.
name: Test

on:
  workflow_call:
    inputs:
      sha:
        description: 테스트할 커밋이자 이미지 태그(PR head SHA)
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  # ── unit ─────────────────────────────────────────────────────────────────
  # job 을 더 쪼개면 pr.yml 은 고칠 필요가 없다 — 이 파일의 job 이 모두 성공해야
  # `test` 가 success 가 된다.
  unit:
    name: unit (go)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt 필요:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  # ── kind e2e ─────────────────────────────────────────────────────────────
  # 발행된 이미지로 deploy/overlays/e2e 를 올리고 기동·헬스체크까지 본다(스모크).
  # 기능 e2e 는 아래 TODO 자리에 붙인다.
  e2e:
    name: e2e (kind)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      SHA: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: e2e

      # 노드가 ghcr 에서 직접 pull 하지 않는다: 러너가 받아서 `kind load` 한다. 그래야 노드에
      # 레지스트리 자격증명을 줄 필요가 없고, 비공개 패키지도 같은 경로로 동작한다.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published images and load into kind
        run: |
          set -euo pipefail
          docker pull "ghcr.io/dlddu/explain-loop:${SHA}"
          kind load docker-image "ghcr.io/dlddu/explain-loop:${SHA}" --name e2e

      # 이름은 그대로 두고 태그만 PR head SHA 로 바꾼다(overlay 파일 끝에 덧붙임 — 러너의
      # 일회성 체크아웃이라 커밋되지 않는다).
      - name: Point the e2e overlay at this PR's images
        run: |
          cat >> deploy/overlays/e2e/kustomization.yaml <<EOF
          images:
            - name: ghcr.io/dlddu/explain-loop
              newTag: "${SHA}"
          EOF
          kubectl kustomize deploy/overlays/e2e | grep -E 'image:'

      - name: Deploy
        run: |
          kubectl apply -k deploy/overlays/e2e
          kubectl rollout status deploy/explain-loop --timeout=180s

      - name: Smoke — health endpoint
        run: |
          set -euo pipefail
          kubectl port-forward svc/explain-loop 18080:80 >/tmp/pf.log 2>&1 &
          trap 'kill %1 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-delay 2 --retry-all-errors \
            "http://127.0.0.1:18080/healthz"

      - name: Smoke — MCP initialize · tools/list
        run: |
          set -euo pipefail
          kubectl port-forward svc/explain-loop 18080:80 >/tmp/pf.log 2>&1 &
          trap 'kill %1 2>/dev/null || true' EXIT
          rpc() {
            curl -fsS --retry 15 --retry-delay 2 --retry-all-errors \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d "$1" http://127.0.0.1:18080/mcp
          }
          init="$(rpc '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"e2e","version":"0"}}}')"
          echo "$init"
          echo "$init" | jq -e '.result.serverInfo.name == "explain-loop"'
          list="$(rpc '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')"
          echo "$list"
          echo "$list" | jq -e '.result.tools | type == "array"'

      # TODO: PRD 기능이 붙으면 테스트 문서(T1–T4) 시나리오를 여기 e2e 로 옮긴다.

      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get all -o wide || true
          kubectl describe deploy/explain-loop || true
          kubectl logs deploy/explain-loop --tail=200 || true
          kubectl get events --sort-by=.lastTimestamp | tail -50 || true
